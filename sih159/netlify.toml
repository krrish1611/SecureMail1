# Netlify Configuration for SecureMailScope Frontend

[build]
  base = "sih159/frontend"
  publish = "dist"
  command = "npm run build"

# Proxy /api requests to the deployed Vercel backend
[[redirects]]
  from = "/api/*"
  to = "https://securemail1-backend-b52m7el2a-krrishsah1611-4750.vercel.app/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
